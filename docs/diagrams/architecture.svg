<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 720" width="1200" height="720">
  <title id="title">grokbot-bridge architecture and trust boundaries</title>
  <desc id="desc">Excalidraw-style diagram for the grokbot-bridge documentation.</desc>
  <rect width="100%" height="100%" fill="#fffdf8"/>
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".009" numOctaves="1" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#2f2f2f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="60" y="62" fill="#2f2f2f" font-size="34" font-weight="750" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">One outbound webhook. One read-only local cache.</text>
  <text x="60" y="102" fill="#66615b" font-size="20" font-weight="500" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">The bridge joins two mechanisms Grok Bot already provides; it does not drive the desktop UI.</text>
  <rect x="45" y="140" width="730" height="500" rx="26" fill="#ffffff" stroke="#7c68a8" stroke-width="3" filter="url(#wobble)"/>
  <rect x="47" y="139" width="728" height="501" rx="26" fill="none" stroke="#7c68a8" stroke-width="1.2" opacity=".28"/>
  <text x="80" y="185" fill="#7c68a8" font-size="18" font-weight="750" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">YOUR MAC</text>
  <rect x="95" y="230" width="210" height="125" rx="20" fill="#f0ebf8" stroke="#7c68a8" stroke-width="3" filter="url(#wobble)"/>
  <rect x="97" y="229" width="208" height="126" rx="20" fill="none" stroke="#7c68a8" stroke-width="1.2" opacity=".28"/>
  <text x="200" y="278" fill="#7c68a8" font-size="25" font-weight="750" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">MCP client</text>
  <text x="200" y="316" fill="#2f2f2f" font-size="19" font-weight="500" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">calls 4 tools</text>
  <rect x="395" y="210" width="310" height="165" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="3" filter="url(#wobble)"/>
  <rect x="397" y="209" width="308" height="166" rx="20" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity=".28"/>
  <text x="550" y="260" fill="#2f2f2f" font-size="27" font-weight="750" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">grokbot-bridge</text>
  <text x="550" y="302" fill="#66615b" font-size="19" font-weight="500" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">stdio MCP server</text>
  <text x="550" y="335" fill="#66615b" font-size="18" font-weight="500" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">polls every 2s by default</text>
  <path d="M 305 292 L 385 292" fill="none" stroke="#7c68a8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="395" y="455" width="310" height="125" rx="20" fill="#e7f5eb" stroke="#4d9b69" stroke-width="3" filter="url(#wobble)"/>
  <rect x="397" y="454" width="308" height="126" rx="20" fill="none" stroke="#4d9b69" stroke-width="1.2" opacity=".28"/>
  <text x="550" y="500" fill="#4d9b69" font-size="24" font-weight="750" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Desktop app cache</text>
  <text x="550" y="537" fill="#2f2f2f" font-size="16" font-weight="500" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">account slot · roster · transcripts</text>
  <path d="M 550 445 L 550 385" fill="none" stroke="#4d9b69" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="570" y="423" fill="#4d9b69" font-size="17" font-weight="650" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">read-only</text>
  <rect x="835" y="140" width="320" height="500" rx="26" fill="#ffffff" stroke="#4d9b69" stroke-width="3" filter="url(#wobble)"/>
  <rect x="837" y="139" width="318" height="501" rx="26" fill="none" stroke="#4d9b69" stroke-width="1.2" opacity=".28"/>
  <text x="870" y="185" fill="#4d9b69" font-size="18" font-weight="750" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">GROK BOT CLOUD</text>
  <rect x="885" y="230" width="220" height="125" rx="20" fill="#ffedd5" stroke="#f59e0b" stroke-width="3" filter="url(#wobble)"/>
  <rect x="887" y="229" width="218" height="126" rx="20" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity=".28"/>
  <text x="995" y="275" fill="#f59e0b" font-size="24" font-weight="750" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Routine webhook</text>
  <text x="995" y="313" fill="#2f2f2f" font-size="19" font-weight="500" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">runs the Bot</text>
  <rect x="885" y="455" width="220" height="125" rx="20" fill="#e7f5eb" stroke="#4d9b69" stroke-width="3" filter="url(#wobble)"/>
  <rect x="887" y="454" width="218" height="126" rx="20" fill="none" stroke="#4d9b69" stroke-width="1.2" opacity=".28"/>
  <text x="995" y="500" fill="#4d9b69" font-size="24" font-weight="750" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Bot reply</text>
  <text x="995" y="537" fill="#2f2f2f" font-size="18" font-weight="500" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">starts with reply tag</text>
  <path d="M 705 270 L 875 270" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="790" y="246" fill="#f59e0b" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">HTTPS POST</text>
  <path d="M 995 365 L 995 445" fill="none" stroke="#4d9b69" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1015" y="410" fill="#4d9b69" font-size="17" font-weight="650" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">run</text>
  <path d="M 875 525 L 715 525" fill="none" stroke="#4d9b69" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="10 9"/>
  <text x="795" y="500" fill="#4d9b69" font-size="17" font-weight="650" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">desktop app sync</text>
  <rect x="85" y="665" width="280" height="44" rx="22" fill="#ffedd5" stroke="#f59e0b" stroke-width="3" filter="url(#wobble)"/>
  <rect x="87" y="664" width="278" height="45" rx="22" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity=".28"/>
  <text x="225" y="694" fill="#f59e0b" font-size="18" font-weight="650" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">webhook key = authentication</text>
  <rect x="390" y="665" width="270" height="44" rx="22" fill="#f0ebf8" stroke="#7c68a8" stroke-width="3" filter="url(#wobble)"/>
  <rect x="392" y="664" width="268" height="45" rx="22" fill="none" stroke="#7c68a8" stroke-width="1.2" opacity=".28"/>
  <text x="525" y="694" fill="#7c68a8" font-size="18" font-weight="650" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">reply_tag = correlation only</text>
  <rect x="685" y="665" width="430" height="44" rx="22" fill="#e7f5eb" stroke="#4d9b69" stroke-width="3" filter="url(#wobble)"/>
  <rect x="687" y="664" width="428" height="45" rx="22" fill="none" stroke="#4d9b69" stroke-width="1.2" opacity=".28"/>
  <text x="900" y="694" fill="#4d9b69" font-size="18" font-weight="650" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">no Cursor/xAI private API is called</text>
</svg>
