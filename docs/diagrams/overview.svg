<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 620" width="1200" height="620">
  <title id="title">What grokbot-bridge does</title>
  <desc id="desc">Excalidraw-style diagram for the grokbot-bridge documentation.</desc>
  <rect width="100%" height="100%" fill="#fffdf8"/>
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".009" numOctaves="1" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#2f2f2f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="60" y="65" fill="#2f2f2f" font-size="34" font-weight="750" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Use your Grok Bot from code — without switching windows.</text>
  <text x="60" y="105" fill="#66615b" font-size="20" font-weight="500" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Example: MiniMax Code sends a research task; the matching Bot reply returns to the same tool call.</text>
  <rect x="70" y="170" width="280" height="210" rx="20" fill="#f0ebf8" stroke="#7c68a8" stroke-width="3" filter="url(#wobble)"/>
  <rect x="72" y="169" width="278" height="211" rx="20" fill="none" stroke="#7c68a8" stroke-width="1.2" opacity=".28"/>
  <text x="210" y="220" fill="#7c68a8" font-size="28" font-weight="750" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Coding agent</text>
  <text x="210" y="265" fill="#2f2f2f" font-size="20" font-weight="500" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Claude Code · Codex</text>
  <text x="210" y="296" fill="#2f2f2f" font-size="20" font-weight="500" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">MiniMax Code · Cursor</text>
  <rect x="125" y="322" width="170" height="44" rx="22" fill="#ffffff" stroke="#7c68a8" stroke-width="3" filter="url(#wobble)"/>
  <rect x="127" y="321" width="168" height="45" rx="22" fill="none" stroke="#7c68a8" stroke-width="1.2" opacity=".28"/>
  <text x="210" y="351" fill="#7c68a8" font-size="18" font-weight="650" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">MCP client</text>
  <rect x="460" y="150" width="280" height="250" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="3" filter="url(#wobble)"/>
  <rect x="462" y="149" width="278" height="251" rx="20" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity=".28"/>
  <text x="600" y="205" fill="#2f2f2f" font-size="30" font-weight="750" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">grokbot-bridge</text>
  <text x="600" y="252" fill="#4d9b69" font-size="22" font-weight="700" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">list + read</text>
  <text x="600" y="286" fill="#f59e0b" font-size="22" font-weight="700" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">ask + wait</text>
  <text x="600" y="337" fill="#66615b" font-size="20" font-weight="550" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">No clicks. No focus.</text>
  <text x="600" y="366" fill="#66615b" font-size="20" font-weight="550" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">No clipboard.</text>
  <rect x="850" y="170" width="280" height="210" rx="20" fill="#e7f5eb" stroke="#4d9b69" stroke-width="3" filter="url(#wobble)"/>
  <rect x="852" y="169" width="278" height="211" rx="20" fill="none" stroke="#4d9b69" stroke-width="1.2" opacity=".28"/>
  <text x="990" y="220" fill="#4d9b69" font-size="28" font-weight="750" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Your Grok Bot</text>
  <text x="990" y="265" fill="#2f2f2f" font-size="20" font-weight="500" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Routine runs in cloud</text>
  <text x="990" y="296" fill="#2f2f2f" font-size="20" font-weight="500" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Reply syncs to app cache</text>
  <rect x="905" y="322" width="170" height="44" rx="22" fill="#ffffff" stroke="#4d9b69" stroke-width="3" filter="url(#wobble)"/>
  <rect x="907" y="321" width="168" height="45" rx="22" fill="none" stroke="#4d9b69" stroke-width="1.2" opacity=".28"/>
  <text x="990" y="351" fill="#4d9b69" font-size="18" font-weight="650" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">existing Bot</text>
  <path d="M 350 275 L 450 275" fill="none" stroke="#7c68a8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="400" y="250" fill="#66615b" font-size="17" font-weight="600" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">tools</text>
  <path d="M 740 275 L 840 275" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="790" y="250" fill="#66615b" font-size="17" font-weight="600" text-anchor="middle" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">task / reply</text>
  <rect x="70" y="470" width="1060" height="95" rx="18" fill="#ffffff" stroke="#2f2f2f" stroke-width="3" filter="url(#wobble)"/>
  <rect x="72" y="469" width="1058" height="96" rx="18" fill="none" stroke="#2f2f2f" stroke-width="1.2" opacity=".28"/>
  <text x="105" y="512" fill="#4d9b69" font-size="21" font-weight="750" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Good fit</text>
  <text x="215" y="512" fill="#2f2f2f" font-size="20" font-weight="500" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">macOS + signed-in Grok Bot app + Node 20+; routines are needed only for sending.</text>
  <text x="105" y="545" fill="#f59e0b" font-size="21" font-weight="750" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">Not this</text>
  <text x="215" y="545" fill="#2f2f2f" font-size="20" font-weight="500" text-anchor="start" font-family="ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Segoe UI&quot;, sans-serif">a public chat API, UI automation, or real-time two-way sync.</text>
</svg>
